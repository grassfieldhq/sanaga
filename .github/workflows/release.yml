# Sanaga's installable packages, built by GitHub for every distribution.
#
# Tags and releases are the version of Cargo.toml exactly, as Semantic
# Versioning writes it: 0.4.0, 1.2.3, 2.0.0-beta.1 (no "v" in front).
#
# A release is made only when a version tag is pushed (the tag must be the
# version in Cargo.toml): never on a push to main. A published version is
# never replaced and its tag never moved: a fix is a new version. A version
# with a pre-release part (1.0.0-rc.1) is published as a pre-release.
#
# Packages: Flatpak (every distribution, video codecs included), .deb
# (Debian, Ubuntu, Mint, Pop!_OS…), .rpm (Fedora), Arch package
# (Arch, Manjaro, EndeavourOS, Omarchy…) and a .tar.gz with an installer for
# the others.
name: Release

on:
  push:
    # only version tags: MAJOR.MINOR.PATCH, with or without a pre-release part
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]

# (read only by default; only the job that publishes may write: see publish)
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # Semantic Versioning: MAJOR.MINOR.PATCH, then -pre.release, +build
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::The version \"$version\" in Cargo.toml is not a Semantic Versioning version (e.g. 1.2.3)."
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Releases are made from a version tag only."
            exit 1
          fi
          if [[ "${GITHUB_REF#refs/tags/}" != "$version" ]]; then
            echo "::error::The tag ${GITHUB_REF#refs/tags/} is not the version $version in Cargo.toml. Put the same version in Cargo.toml (and pkgver in packaging/arch/PKGBUILD), commit, then put the tag on that commit (see docs/RELEASING.md)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

  deb:
    name: Debian / Ubuntu (.deb) and generic archive
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libjavascriptcoregtk-6.0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build and test
        run: |
          cargo build --release --locked
          cargo test --release --locked
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deb
      - name: .deb package
        run: |
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb "dist/sanaga_${{ needs.version.outputs.version }}_amd64.deb"
      - name: Generic archive (program + installer)
        run: |
          name="sanaga-${{ needs.version.outputs.version }}-x86_64-linux"
          mkdir -p "$name/target/release" "$name/packaging"
          cp target/release/sanaga "$name/target/release/"
          cp packaging/install.sh packaging/sanaga.desktop packaging/sanaga.svg "$name/packaging/"
          cp README.md LICENSE CHANGELOG.md "$name/"
          printf '#!/bin/sh\nexec "$(dirname "$0")/packaging/install.sh" "$@"\n' > "$name/install.sh"
          chmod +x "$name/install.sh" "$name/packaging/install.sh"
          tar czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-and-archive
          path: dist/*

  rpm:
    name: Fedora (.rpm)
    needs: version
    runs-on: ubuntu-24.04
    # the oldest Fedora the package is for (it also runs on the newer ones)
    container: fedora:43@sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5
    steps:
      - name: System libraries
        run: dnf install -y --allowerasing git gcc pkgconf-pkg-config gtk4-devel webkitgtk6.0-devel libsoup3-devel curl tar gzip xz
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build
        # (the package brings the codecs as dependencies: Sanaga never offers
        # to install them)
        run: SANAGA_DISTRO=fedora cargo build --release --locked
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-generate-rpm
      - name: .rpm package
        run: |
          cargo generate-rpm
          mkdir -p dist
          cp target/generate-rpm/*.rpm "dist/sanaga-${{ needs.version.outputs.version }}.x86_64.rpm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm
          path: dist/*

  arch:
    name: Arch Linux (.pkg.tar.zst)
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux:latest@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    steps:
      - name: System libraries
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 webkitgtk-6.0 gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-libav libsecret hicolor-icon-theme
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Package (built from this commit)
        run: |
          useradd -m builder
          mkdir -p /tmp/pkg
          sed -e "s|^source=.*|source=(\"sanaga::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" packaging/arch/PKGBUILD > /tmp/pkg/PKGBUILD
          chown -R builder /tmp/pkg
          git config --system --add safe.directory '*'
          su builder -c "cd /tmp/pkg && makepkg --noconfirm --nodeps"
          mkdir -p dist
          for f in /tmp/pkg/sanaga-[0-9]*.pkg.tar.zst; do cp "$f" dist/; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch
          path: dist/*

  flatpak:
    name: Flatpak (every distribution)
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust sources for the offline build
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q aiohttp tomlkit pyyaml
          # (a fixed version of the generator, not whatever master holds today)
          curl -sSfL -o /tmp/flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          /tmp/venv/bin/python /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: packaging/flatpak/site.grassfield.Sanaga.yml
          bundle: sanaga-${{ needs.version.outputs.version }}.flatpak
          upload-artifact: true
          artifact-name: flatpak

  publish:
    name: Publish
    needs: [version, deb, rpm, arch, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # signed statements of where the packages were built (see "Sign the packages")
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect the packages
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.flatpak' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      # Each package gets a signed statement that it was built by this
      # workflow from this commit (Sigstore, no key to keep). Anyone checks
      # one with: gh attestation verify <file> --repo grassfieldhq/sanaga
      - name: Sign the packages
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - name: Release notes
        run: |
          # this version's part of the changelog, else the unreleased part
          section() { awk -v v="$1" 'index($0, "## [" v "]") == 1 {p=1; next} /^## \[/ {if (p) exit} p' CHANGELOG.md; }
          section "$VERSION" > notes.md
          grep -q '[^[:space:]]' notes.md || section Unreleased > notes.md
          cat packaging/RELEASE-INSTALL.md >> notes.md
      - name: Publish
        run: |
          # 1.2.3-beta.1: a pre-release (never shown as the latest one)
          if [[ "$VERSION" == *-* ]]; then
            kind=(--prerelease)
          else
            kind=(--latest)
          fi
          # a published version is never replaced (its packages and its tag
          # stay what they were): a fix is a new version
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::The release $TAG exists already: publish a new version instead."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag "${kind[@]}" dist/*
