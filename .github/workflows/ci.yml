name: CI

on:
  push:
    branches: [main]
  pull_request:

# (read only: CI never writes to the repository)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries (GTK 4, WebKitGTK 6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libjavascriptcoregtk-6.0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config python3

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --locked

      - name: Tests
        run: cargo test --locked

      - name: Clippy (advice only)
        continue-on-error: true
        run: cargo clippy --locked -- -D warnings

      - name: Translations complete
        run: python3 tools/i18n.py check
