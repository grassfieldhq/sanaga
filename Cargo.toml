[package]
name = "sanaga"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Sanaga — a fast, light web browser for Linux built on WebKitGTK, with a built-in mobile simulator"
license = "MIT"
readme = "README.md"
repository = "https://github.com/grassfieldhq/sanaga"
homepage = "https://github.com/grassfieldhq/sanaga"
keywords = ["browser", "webkit", "gtk", "egui", "linux"]
categories = ["gui", "web-programming"]
exclude = ["shots/", "docs/screenshots/*.xcf"]

[[bin]]
name = "sanaga"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip", "charset", "cookies"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
# extensions from other browsers (.xpi, .crx, .zip)
flate2 = "1"
# file flags (O_NOFOLLOW), the download mark (extended attributes) and the
# single-instance socket's peer check (already built for other crates)
libc = "0.2"

# The window and the web engine: GTK 4 + WebKitGTK 6, on Linux and the BSDs.
# (On Windows and macOS the build stops with a clear message: docs/PORTING.md.)
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios", target_os = "android")))'.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
webkit6 = { version = "0.6.1", features = ["v2_48"] }
cairo-rs = { version = "0.22", features = ["png"] }
egui_glow = "0.37"
glow = "0.17"
libloading = "0.8"
# screen readers (Orca…): the interface described over AT-SPI
accesskit = "0.25"
accesskit_unix = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
