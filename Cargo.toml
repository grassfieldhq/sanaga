[package]
name = "sanaga"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Sanaga — a fast, light web browser for Linux built on WebKitGTK, with a built-in mobile simulator"
license = "MIT"
readme = "README.md"
repository = "https://github.com/grassfieldhq/sanaga"
homepage = "https://github.com/grassfieldhq/sanaga"
keywords = ["browser", "webkit", "gtk", "egui", "linux"]
categories = ["gui", "web-programming"]
exclude = ["shots/", "docs/screenshots/*.xcf"]

[[bin]]
name = "sanaga"
path = "src/main.rs"

# Debian / Ubuntu package (`cargo deb`): the video codecs YouTube & co. need
# come in as dependencies.
[package.metadata.deb]
maintainer = "Grassfield"
section = "web"
priority = "optional"
depends = "libgtk-4-1, libwebkitgtk-6.0-4, bubblewrap, xdg-dbus-proxy, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav, libsecret-tools"
recommends = "gstreamer1.0-vaapi"
suggests = "ffmpeg, chromium"
extended-description = "A fast, light web browser built on WebKitGTK: containers, a network blocker of ads and trackers, settings for each website, tab groups and tree tabs, a reader, and a mobile simulator for web developers."
assets = [
    ["target/release/sanaga", "usr/bin/", "755"],
    ["packaging/sanaga.desktop", "usr/share/applications/", "644"],
    ["packaging/sanaga.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/site.grassfield.Sanaga.metainfo.xml", "usr/share/metainfo/", "644"],
    ["README.md", "usr/share/doc/sanaga/", "644"],
]

# Fedora package (`cargo generate-rpm`, after `cargo build --release`): the
# codecs come in as dependencies here too.
[package.metadata.generate-rpm]
summary = "A fast, light web browser built on WebKitGTK"
assets = [
    { source = "target/release/sanaga", dest = "/usr/bin/sanaga", mode = "755" },
    { source = "packaging/sanaga.desktop", dest = "/usr/share/applications/sanaga.desktop", mode = "644" },
    { source = "packaging/sanaga.svg", dest = "/usr/share/icons/hicolor/scalable/apps/sanaga.svg", mode = "644" },
    { source = "packaging/site.grassfield.Sanaga.metainfo.xml", dest = "/usr/share/metainfo/site.grassfield.Sanaga.metainfo.xml", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/sanaga/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/sanaga/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
gtk4 = "*"
"webkitgtk6.0" = "*"
bubblewrap = "*"
xdg-dbus-proxy = "*"
gstreamer1-plugins-base = "*"
gstreamer1-plugins-good = "*"
gstreamer1-plugins-bad-free = "*"
gstreamer1-plugin-libav = "*"
libsecret = "*"
hicolor-icon-theme = "*"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip", "charset", "cookies"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
# extensions from other browsers (.xpi, .crx, .zip)
flate2 = "1"
# file flags (O_NOFOLLOW), the download mark (extended attributes) and the
# single-instance socket's peer check (already built for other crates)
libc = "0.2"
# TLS for Sanaga's own requests with the system's certificate authorities
# (already built for ureq: same version and features, no new crate)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# The window and the web engine: GTK 4 + WebKitGTK 6, on Linux and the BSDs.
# (On Windows and macOS the build stops with a clear message: docs/PORTING.md.)
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios", target_os = "android")))'.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
webkit6 = { version = "0.6.1", features = ["v2_48"] }
cairo-rs = { version = "0.22", features = ["png"] }
egui_glow = "0.37"
glow = "0.17"
libloading = "0.8"
# screen readers (Orca…): the interface described over AT-SPI
accesskit = "0.25"
accesskit_unix = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
